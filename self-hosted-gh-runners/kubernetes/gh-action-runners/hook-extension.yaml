apiVersion: v1
kind: ConfigMap
metadata:
  name: hook-extension
  namespace: arc-gh-runners
data:
  content: |
    spec:
      containers:
        - name: "$job"
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: "safe.directory"
            - name: GIT_CONFIG_VALUE_0
              value: "*"