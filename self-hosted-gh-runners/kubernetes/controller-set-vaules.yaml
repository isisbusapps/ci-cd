# gha-runner-scale-set-controller values
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
# Version: 0.14.2

replicaCount: 1

# Watch all namespaces by default. To restrict the controller to a single
# namespace (tighter RBAC), uncomment:
# flags:
#   watchSingleNamespace: "lgtm"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Expose controller-manager metrics — scrapeable by Alloy/Prometheus.
metrics:
  controllerManagerAddr: ":8080"
  listenerAddr: ":8080"
  listenerEndpoint: "/metrics"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

flags:
  logLevel: "info"
  logFormat: "json"   # json plays nicer with Loki than the default text format
  # Increase if runner provisioning lags under load (watch k8s API rate limits):
  # runnerMaxConcurrentReconciles: 2