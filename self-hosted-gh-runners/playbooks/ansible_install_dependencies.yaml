- name: Install dependencies
  remote_user: ubuntu
  hosts: 127.0.0.1
  connection: local
  
  tasks:
    - name: Install docker
      become: true
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Install docker buildkit features
      become: true
      ansible.builtin.apt:
        name: docker-buildx
        state: present
      
    - name: Install GitHub CLI
      become: true
      ansible.builtin.apt:
        name: gh
        state: present

    - name: Setup docker user
      become: true
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Install Kubectl pre requisite packages
      become: true
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
    
    - name: Check keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    
    - name: Download repo signing key
      become: true
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key"
        dest: /etc/apt/keyringskubernetes-release.key
        mode: "0644"

    - name: De armour key into keyring
      become: true
      ansible.builtin.command:
        cmd: "gpg --dearmor -o /etc/apt/keyringskubernetes-release.key"

    - name: Ensure keyring is world-readable
      become: true
      ansible.builtin.file:
        path: "/etc/apt/keyringskubernetes-release.key"
        mode: "0644"
 
    - name: Add the Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyringskubernetes-release.key] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present
        update_cache: true
  
    - name: Extract Runner
      ansible.builtin.unarchive:
        src: https://github.com/actions/runner/releases/download/v{{RUNNER_VERSION}}/actions-runner-linux-x64-{{RUNNER_VERSION}}.tar.gz
        dest: ~/actions-runner
        remote_src: yes

    - name: Check Automatic Updates
      ansible.builtin.shell:
        cmd: sudo systemctl status unattended-upgrades
    
    - name: Install dependencies
      ansible.builtin.shell:
        chdir: ~/actions-runner
        cmd: sudo ./bin/installdependencies.sh