name: Dev Build and Deploy (Reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Short image name, e.g. auth-service'
        required: true
        type: string
      app-name:
        description: 'Human-readable name for commit messages'
        required: true
        type: string
      gitops-patch-path:
        description: 'Relative path in gitops repo to dev patch-image.yml'
        required: true
        type: string
      use-dockerhub-mirror:
        description: 'Use dockerhub.stfc.ac.uk as a Docker Hub pull-through cache'
        required: false
        type: boolean
        default: false
      registry:
        required: false
        type: string
        default: 'ghcr.io'
      gitops-repo:
        required: false
        type: string
        default: 'isisbusapps/gitops'
      docker-context:
        required: false
        type: string
        default: '.'
      dockerfile-path:
        required: false
        type: string
        default: 'Dockerfile'
      ishelm-deployment:
        required: false
        type: boolean
        default: false
      build-args:
        description: 'Optional dockerfile arguments'
        required: false
        type: string
        default: ''
      isPostgres:
        required: false
        type: boolean
        default: false
      run-liquibase:
        description: 'Run a Liquibase update against the dev database as part of this build'
        required: false
        type: boolean
        default: false
      liquibase-changelog-dir:
        description: 'Repo-relative changelog directory. Only used when run-liquibase is true.'
        required: false
        type: string
        default: 'liquibase'
      liquibase-changelog-file:
        description: 'Changelog entry point, relative to liquibase-changelog-dir'
        required: false
        type: string
        default: 'changelog.xml'
    secrets:
      workflow-token:
        description: 'PAT with repo+workflow scope for the GitOps repo'
        required: true
      db-url:
        description: 'JDBC URL for the dev database. Required when run-liquibase is true.'
        required: false
      db-username:
        description: 'Dev database user. Required when run-liquibase is true.'
        required: false
      db-password:
        description: 'Dev database password. Required when run-liquibase is true.'
        required: false

permissions:
  packages: read
  contents: read
  pull-requests: read

jobs:
  build_and_push:
    name: Build and Push Container
    runs-on: fase-self-hosted-dind
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    outputs:
      image-digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx (with mirror)
        if: inputs.use-dockerhub-mirror
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub.stfc.ac.uk"]

      - name: Set up Docker Buildx
        if: ${{ !inputs.use-dockerhub-mirror }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}:dev
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: ${{ inputs.build-args }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  liquibase_update:
    name: Update Database Schema
    needs: build_and_push
    if: ${{ inputs.run-liquibase && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: isisbusapps/ci-cd/.github/workflows/liquibase-update-reusable-workflow.yaml@main
    with:
      app-name: ${{ inputs.app-name }}
      environment: DEV
      changelog-dir: ${{ inputs.liquibase-changelog-dir }}
      changelog-file: ${{ inputs.liquibase-changelog-file }}
    secrets:
      db-url: ${{ secrets.db-url }}
      db-username: ${{ secrets.db-username }}
      db-password: ${{ secrets.db-password }}

  update_gitops:
    name: Update GitOps Repository
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    timeout-minutes: 10
    needs: build_and_push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ secrets.workflow-token }}

      - name: Update image reference
        if: ${{ !inputs.ishelm-deployment }}
        run: |
          yq e -i '.spec.template.spec.containers[0].image = "${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ needs.build_and_push.outputs.image-digest }}"' \
            "$GITHUB_WORKSPACE/${{ inputs.gitops-patch-path }}"

      - name: Update image reference for helm deployment
        if: ${{ inputs.ishelm-deployment }}
        run: |
          if [ "${{ inputs.isPostgres }}" = "true" ]; then
            yq e -i '.image_duo_ref = "${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ needs.build_and_push.outputs.image-digest }}"' \
              "$GITHUB_WORKSPACE/${{ inputs.gitops-patch-path }}"
          else
            yq e -i '.image_ref = "${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ needs.build_and_push.outputs.image-digest }}"' \
              "$GITHUB_WORKSPACE/${{ inputs.gitops-patch-path }}"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "[CD] Update ${{ inputs.app-name }} with this commit ${{ github.event.head_commit.url }}"
          git push
