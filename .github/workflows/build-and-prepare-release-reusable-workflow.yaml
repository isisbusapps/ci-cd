name: Build and Prepare Release (Reusable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      app-name:
        required: true
        type: string
      gitops-patch-path:
        description: 'Relative path in gitops repo to prod patch-image.yml'  
        required: true     
        type: string
      release-version:
        description: 'Semver string WITHOUT v prefix, e.g. 1.2.3'
        required: true
        type: string
      tag-prefix:
        description: 'Monorepo only. Prefix for tags and the changelog range, e.g. frontend-. Leave empty for single-app repos.'
        required: false
        type: string
        default: ''
      changelog-paths:
        description: 'Monorepo only. Newline-separated path prefixes; only commits touching them appear in the changelog, e.g. frontend/'
        required: false
        type: string
        default: ''
      changelog-config-path:
        description: 'Path in the calling repo to the changelog config'
        required: false
        type: string
        default: '.github/release-changelog-config.json'
      is-hotfix:
        required: false
        type: boolean
        default: false
      use-dockerhub-mirror:
        required: false
        type: boolean
        default: false
      registry:
        required: false
        type: string
        default: 'ghcr.io'
      gitops-repo:
        required: false
        type: string
        default: 'isisbusapps/gitops'
      docker-context:
        required: false
        type: string
        default: '.'
      dockerfile-path:
        required: false
        type: string
        default: 'Dockerfile'
      ishelm-deployment:
        required: false
        type: boolean
        default: false
      build-args:
        description: 'Optional dockerfile arguments'
        required: false
        type: string
        default: ''
      isPostgres:
        required: false
        type: boolean
        default: false  
      version-tag:
        description: 'Optional image tag to use instead of digest (e.g. 1.2.3). If omitted, the image digest is used.'
        required: false
        type: string
        default: ''
      run-liquibase:
        description: 'Run a Liquibase update against the prod database as part of this release'
        required: false
        type: boolean
        default: false
      liquibase-changelog-dir:
        description: 'Repo-relative changelog directory. Only used when run-liquibase is true.'
        required: false
        type: string
        default: 'liquibase'
      liquibase-changelog-file:
        description: 'Changelog entry point, relative to liquibase-changelog-dir'
        required: false
        type: string
        default: 'changelog.xml'
    secrets:
      workflow-token:
        required: true
      db-url:
        description: 'JDBC URL for the prod database. Required when run-liquibase is true.'
        required: false
      db-username:
        description: 'Prod database user. Required when run-liquibase is true.'
        required: false
      db-password:
        description: 'Prod database password. Required when run-liquibase is true.'
        required: false

permissions:
  packages: read
  contents: read
  pull-requests: read

jobs:
  build_and_push:
    name: Build and Push Container
    runs-on: fase-self-hosted-dind
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    outputs:
      image-digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx (with mirror)
        if: inputs.use-dockerhub-mirror
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub.stfc.ac.uk"]

      - name: Set up Docker Buildx
        if: ${{ !inputs.use-dockerhub-mirror }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.release-version }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: ${{ inputs.build-args }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  liquibase_update:
    name: Update Database Schema
    needs: build_and_push
    if: ${{ inputs.run-liquibase }}
    uses: isisbusapps/ci-cd/.github/workflows/liquibase-update-reusable-workflow.yaml@main
    with:
      app-name: ${{ inputs.app-name }}
      environment: PROD
      changelog-dir: ${{ inputs.liquibase-changelog-dir }}
      changelog-file: ${{ inputs.liquibase-changelog-file }}
    secrets:
      db-url: ${{ secrets.db-url }}
      db-username: ${{ secrets.db-username }}
      db-password: ${{ secrets.db-password }}

  update_gitops:
    name: Update GitOps Repository
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    timeout-minutes: 10
    needs: build_and_push
    outputs:
      branch-name: ${{ steps.branch.outputs.name }}
    steps:

      - name: Generate branch name
        id: branch
        run: |
          BRANCH_NAME="release/${{ github.repository_owner }}/${{ inputs.image-name }}-${{ inputs.release-version }}"
          echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ secrets.workflow-token }}

      - name: Update version comment
        run: |
          sed -i 's/# version: .*/# version: ${{ inputs.release-version }}/' './${{ inputs.gitops-patch-path }}'

      - name: Resolve image reference
        id: resolve_image
        run: |
          if [[ -n "${{ inputs.version-tag }}" ]]; then
            echo "image-ref=${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.version-tag }}" >> $GITHUB_OUTPUT
          else
            echo "image-ref=${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ needs.build_and_push.outputs.image-digest }}" >> $GITHUB_OUTPUT
          fi

      - name: Update image reference
        if: ${{ !inputs.ishelm-deployment }}
        run: |
          yq e -i '.spec.template.spec.containers[0].image = "${{ steps.resolve_image.outputs.image-ref }}"' \
            "$GITHUB_WORKSPACE/${{ inputs.gitops-patch-path }}"

      - name: Update image reference for helm deployment
        if: ${{ inputs.ishelm-deployment }}
        run: |
          if [ "${{ inputs.isPostgres }}" = "true" ]; then
            yq e -i '.image_duo_ref = "${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ needs.build_and_push.outputs.image-digest }}"' \
              "$GITHUB_WORKSPACE/${{ inputs.gitops-patch-path }}"
          else
            yq e -i '.image_ref = "${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ needs.build_and_push.outputs.image-digest }}"' \
              "$GITHUB_WORKSPACE/${{ inputs.gitops-patch-path }}"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b "${{ steps.branch.outputs.name }}"
          git commit -am "[CD] Release ${{ inputs.app-name }} ${{ inputs.release-version }}"
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

  trigger_pr:
    name: Trigger PR Creation
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    timeout-minutes: 5
    needs: update_gitops
    steps:
      - name: Trigger GitOps PR workflow
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
        run: |
          gh workflow run create-release-pr.yaml \
            --repo "${{ inputs.gitops-repo }}" \
            --field branchName="${{ needs.update_gitops.outputs.branch-name }}" \
            --field releaseVersion="${{ inputs.release-version }}" \
            --field imageName="${{ github.repository_owner }}/${{ inputs.image-name }}" \
            --field sourceRepo="${{ github.repository }}" \
            --field actor="${{ github.actor }}"

  create_tags:
    name: Create Git Tags
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    timeout-minutes: 5
    needs: build_and_push
    permissions:
      contents: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Create and push tags
        run: |
          git tag "${{ inputs.tag-prefix }}${{ inputs.release-version }}"
          git push origin "${{ inputs.tag-prefix }}${{ inputs.release-version }}"
          git tag -f "${{ inputs.tag-prefix }}latest"
          git push -f origin "${{ inputs.tag-prefix }}latest"

  create_release:
    name: Create GitHub Pre-Release
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    timeout-minutes: 10
    needs: create_tags
    permissions:
      contents: write
      discussions: write
      pull-requests: read
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Build changelog configuration
        id: changelog_config
        if: inputs.tag-prefix != ''
        env:
          CONFIG_PATH: ${{ inputs.changelog-config-path }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          if [ ! -f "$CONFIG_PATH" ]; then
            CONFIG_PATH=/tmp/changelog-config-base.json
            echo '{}' > "$CONFIG_PATH"
          fi

          export PATTERN="^${TAG_PREFIX}([0-9].*)\$"
          yq -o=json -I=0 '
            .tag_resolver.method = "semver" |
            .tag_resolver.filter.pattern = strenv(PATTERN) |
            .tag_resolver.filter.flags = "gu" |
            .tag_resolver.transformer.pattern = strenv(PATTERN) |
            .tag_resolver.transformer.target = "$1"
          ' "$CONFIG_PATH" > /tmp/changelog-config.json

          cat /tmp/changelog-config.json
          echo "json=$(cat /tmp/changelog-config.json)" >> $GITHUB_OUTPUT

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          toTag: ${{ inputs.tag-prefix }}${{ inputs.release-version }}
          configuration: ${{ inputs.changelog-config-path }}
          configurationJson: ${{ steps.changelog_config.outputs.json }}
          includeOnlyPaths: ${{ inputs.changelog-paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-prefix }}${{ inputs.release-version }}
          name: Release ${{ inputs.tag-prefix != '' && format('{0} ', inputs.app-name) || '' }}${{ inputs.release-version }}
          body: ${{ steps.build_changelog.outputs.changelog }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  open_hotfix_pr:
    name: Open Hotfix PR
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    timeout-minutes: 5
    needs: create_tags
    if: inputs.is-hotfix
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Create PR to default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Merge hotfix ${{ inputs.tag-prefix }}${{ inputs.release-version }} into ${{ github.event.repository.default_branch }}" \
            --body "Automated PR to merge hotfix branch back into the default branch after release ${{ inputs.tag-prefix }}${{ inputs.release-version }}." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ github.ref_name }}"
