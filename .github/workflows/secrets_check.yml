name: gitleaks
run-name: Check for leaked secrets
on:
  pull_request:
  push:
  workflow_call:
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - run: |
          vault login -address="${{ secrets.VAULT_URL }}" ${{ secrets.VAULT_TOKEN }} 1> /dev/null
          vault kv get -address="${{ secrets.VAULT_URL }}" -mount="fase-ci-cd" "gitleaks-rules" > "/.gitleaks.toml"
          export GITLEAKS_CONFIG="$(pwd)/.gitleaks.toml"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_NOTIFY_USER_LIST: ${{ secrets.GITLEAKS_NOTIFY_USER_LIST }}
