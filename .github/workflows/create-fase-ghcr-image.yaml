name: Build and Push FASE GH Runner Container

on:
  push:
    branches:
      - main
      - remove-yq-action
    paths:
      - self-hosted-gh-runners/custom-image/Dockerfile
  workflow_dispatch:
  schedule:
    - cron: "40 23 * * 1" # 23:40, Monday

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fase-gh-runner-container

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx (with mirror)
        if: inputs.use-dockerhub-mirror
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub.stfc.ac.uk"]

      - name: Set up Docker Buildx
        if: ${{ !inputs.use-dockerhub-mirror }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: self-hosted-gh-runners/custom-image/
          file: self-hosted-gh-runners/custom-image/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/build-cache:${{ env.IMAGE_NAME }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/build-cache:${{ env.IMAGE_NAME }}
          build-args: ${{ inputs.build-args }}
